<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conversor DUIMP → DI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{

    background:#f3f6fb;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

}

.container{

    width:600px;

    background:white;

    border-radius:10px;

    box-shadow:0 5px 15px rgba(0,0,0,.2);

    overflow:hidden;

}

.header{

    background:#0B5ED7;

    color:white;

    padding:18px;

    font-size:22px;

    font-weight:bold;

}

.content{

    padding:25px;

}

label{

    display:block;

    margin-bottom:8px;

    font-weight:bold;

}

input{

    width:100%;

    padding:12px;

    font-size:18px;

    border:1px solid #CCC;

    border-radius:6px;

}

input[readonly]{

    background:#F4F4F4;

    font-weight:bold;

}

.buttons{

    display:flex;

    justify-content:center;

    gap:15px;

    margin-top:20px;

}

button{

    padding:12px 25px;

    border:none;

    border-radius:6px;

    cursor:pointer;

    font-size:16px;

}

.calcular{

    background:#0B5ED7;

    color:white;

}

.limpar{

    background:#6C757D;

    color:white;

}

.footer{

    margin-top:25px;

    display:flex;

    justify-content:space-between;

}

.copiar{

    background:#198754;

    color:white;

}

.fechar{

    background:#DC3545;

    color:white;

}

.msg{

    margin-top:15px;

    color:red;

    font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

Conversor DUIMP → DI - RENAVAM

</div>

<div class="content">

<label>DUIMP</label>

<input
id="duimp"
placeholder="26BR0000883797-0"
autocomplete="off"
>

<div class="buttons">

<button class="calcular" onclick="calcular()">

Calcular

</button>

<button class="limpar" onclick="limpar()">

Limpar

</button>

</div>

<br>

<label>DI Equivalente</label>

<input
id="resultado"
readonly
>

<div class="footer">

<button class="copiar" onclick="copiar()">

Copiar

</button>

<button class="fechar" onclick="window.close()">

Fechar

</button>

</div>

<div
id="mensagem"
class="msg">
</div>

</div>

</div>

<script>

function calcularDV(numero){

    const pesos=[2,3,4,5,6,7,8,9];

    let soma=0;

    let peso=0;

    for(let i=numero.length-1;i>=0;i--){

        soma+=parseInt(numero[i])*pesos[peso];

        peso++;

        if(peso===pesos.length)
            peso=0;

    }

    let resto=soma%11;

    let dv=11-resto;

    if(dv>=10)
        dv=0;

    return dv;

}

function converter(duimp){

    duimp=duimp.trim().toUpperCase();

    const regex=/^\d{2}BR\d{10}-\d$/;

    if(!regex.test(duimp))
        throw "Formato inválido.\nExemplo:\n26BR0000883797-0";

    let partes=duimp.split("-");

    let base=partes[0];

    let ano=base.substring(0,2);

    let sequencial=base.substring(4);

    sequencial=sequencial.substring(3);

    let numero=ano+sequencial;

    let dv=calcularDV("2"+numero);

    return numero+"-"+dv;

}

function calcular(){

    document.getElementById("mensagem").innerHTML="";

    try{

        let resultado=converter(

            document.getElementById("duimp").value

        );

        document.getElementById("resultado").value=resultado;

    }

    catch(erro){

        document.getElementById("resultado").value="";

        document.getElementById("mensagem").innerHTML=erro;

    }

}

function limpar(){

    document.getElementById("duimp").value="";

    document.getElementById("resultado").value="";

    document.getElementById("mensagem").innerHTML="";

    document.getElementById("duimp").focus();

}

function copiar(){

    let texto=document.getElementById("resultado").value;

    if(texto==="")
        return;

    navigator.clipboard.writeText(texto);

    alert("DI copiada para a área de transferência.");

}

document.getElementById("duimp").addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        calcular();

    }

});

</script>

</body>

</html>
